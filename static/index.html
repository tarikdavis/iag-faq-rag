<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ RAG demo — Avios sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8f8fa;
        --bg-card: #fefefe;
        --bg-user: #e2e8ff;
        --bg-layer3: #edecf1;
        --fg: #000000;
        --fg-secondary: #4b4855;
        --fg-tertiary: #737177;
        --accent: #011dac;
        --accent-subtle: #e2e8ff;
        --border-tertiary: rgba(149, 147, 160, 0.25);
        --opco-ba: #075aaa;
        --opco-aer: #006a4e;
        --opco-iberia: #d52b1e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        background: var(--bg); color: var(--fg);
        margin: 0; padding: 0; line-height: 1.5;
        display: flex; flex-direction: column;
      }

      header {
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-tertiary);
        padding: 14px 24px;
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.3px; margin-right: auto; }
      .brand .sub { display: block; font-size: 11px; font-weight: 500; color: var(--fg-tertiary); letter-spacing: 0; margin-top: -2px; }
      .header-ctrl { display: flex; gap: 6px; align-items: center; }
      .header-ctrl label {
        font-size: 10px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.5px; color: var(--fg-tertiary);
      }
      select {
        padding: 6px 10px; font: inherit; font-size: 13px;
        background: var(--bg-card);
        border: 1px solid var(--border-tertiary);
        border-radius: 6px; cursor: pointer;
      }
      select:focus { outline: none; border-color: var(--accent); }
      .reset-btn {
        padding: 6px 14px; font: inherit; font-size: 12px; font-weight: 600;
        background: transparent; color: var(--fg-secondary);
        border: 1px solid var(--border-tertiary); border-radius: 9999px;
        cursor: pointer; transition: background 120ms;
      }
      .reset-btn:hover { background: var(--bg-layer3); }
      .reset-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      main {
        flex: 1; overflow-y: auto;
        padding: 24px;
        display: flex; flex-direction: column; align-items: center;
      }
      .conversation {
        width: 100%; max-width: 760px;
        display: flex; flex-direction: column; gap: 16px;
      }
      .empty-state {
        text-align: center; color: var(--fg-tertiary);
        padding: 80px 20px;
      }
      .empty-state h2 {
        font-size: 22px; font-weight: 600;
        color: var(--fg-secondary); margin: 0 0 8px;
      }
      .empty-state p { font-size: 14px; max-width: 460px; margin: 0 auto; }

      .turn { display: flex; gap: 12px; }
      .turn.user { justify-content: flex-end; }
      .bubble {
        max-width: 86%;
        padding: 14px 18px; border-radius: 14px;
        line-height: 1.6;
      }
      .turn.user .bubble {
        background: var(--bg-user); color: var(--fg);
        border-bottom-right-radius: 4px;
        font-weight: 500;
      }
      .turn.assistant .bubble {
        background: var(--bg-card);
        border: 1px solid var(--border-tertiary);
        border-bottom-left-radius: 4px;
      }
      .bubble h3, .bubble h4 { font-weight: 600; margin: 12px 0 4px; font-size: 15px; }
      .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
      .bubble a { color: var(--accent); }
      .bubble strong { font-weight: 600; }
      .bubble code { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; background: var(--bg-layer3); padding: 1px 4px; border-radius: 3px; }
      .bubble p { margin: 6px 0; }

      /* Follow-up + new-topic chips below each assistant response.
         Visually subordinate to the answer (smaller, lighter) so the eye
         lands on the response first and the chips read as "what next?"
         affordances rather than primary actions. */
      .followup-chips {
        display: flex; flex-wrap: wrap; gap: 6px;
        margin: 8px 0 4px 4px;
      }
      .followup-chip {
        font-family: inherit; font-size: 12px; line-height: 1.3;
        background: var(--bg-card); color: var(--fg-secondary);
        border: 1px solid var(--border-tertiary); border-radius: 9999px;
        padding: 5px 12px; cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        text-align: left;
      }
      .followup-chip:hover {
        background: var(--accent-subtle); color: var(--accent);
        border-color: var(--accent);
      }
      .followup-chip.new-topic-chip {
        color: var(--fg-tertiary);
        border-style: dashed;
      }
      .followup-chip.new-topic-chip:hover {
        color: var(--fg-secondary); background: var(--bg-layer3);
        border-color: var(--fg-tertiary); border-style: solid;
      }

      .turn-meta {
        font-size: 11px; color: var(--fg-tertiary);
        margin-top: 4px; padding-left: 4px;
        display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      }
      .turn-meta details summary {
        cursor: pointer; user-select: none;
        color: var(--fg-tertiary);
      }
      .turn-meta details summary:hover { color: var(--fg-secondary); }
      .turn-meta details[open] summary { color: var(--fg-secondary); }
      .sources {
        margin-top: 8px; padding: 12px; background: var(--bg);
        border: 1px solid var(--border-tertiary); border-radius: 8px;
      }
      .source-item {
        font-size: 12px; padding: 6px 0;
        border-top: 1px solid var(--border-tertiary);
      }
      .source-item:first-child { border-top: none; padding-top: 0; }
      .source-q { color: var(--fg); font-weight: 500; }
      .source-id {
        font-family: 'JetBrains Mono', monospace; font-size: 10px;
        color: var(--fg-tertiary); margin-top: 2px;
      }
      .source-badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
      .badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px; }
      .badge-ba { background: rgba(7,90,170,0.1); color: var(--opco-ba); }
      .badge-aer { background: rgba(0,106,78,0.1); color: var(--opco-aer); }
      .badge-iberia { background: rgba(213,43,30,0.1); color: var(--opco-iberia); }
      .badge-dist { background: var(--bg-layer3); color: var(--fg-secondary); }

      .typing {
        display: inline-flex; gap: 4px; padding: 6px 0;
      }
      .typing span {
        width: 6px; height: 6px; background: var(--fg-tertiary);
        border-radius: 50%; animation: blink 1.4s infinite both;
      }
      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
      }

      .error-bubble {
        background: rgba(213,43,30,0.05);
        border-color: rgba(213,43,30,0.3);
        color: var(--opco-iberia);
      }

      footer.input-area {
        position: sticky; bottom: 0;
        background: var(--bg-card);
        border-top: 1px solid var(--border-tertiary);
        padding: 16px 24px;
      }
      .input-row {
        max-width: 760px; margin: 0 auto;
        display: flex; gap: 10px; align-items: end;
      }
      .input-row textarea {
        flex: 1; padding: 12px 14px; font: inherit; font-size: 15px;
        background: var(--bg); color: var(--fg);
        border: 1px solid var(--border-tertiary); border-radius: 12px;
        resize: none; max-height: 120px;
        transition: border-color 120ms, box-shadow 120ms;
      }
      .input-row textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-subtle);
      }
      .send-btn {
        padding: 12px 22px; font: inherit; font-weight: 600; font-size: 14px;
        background: var(--accent); color: white;
        border: 0; border-radius: 9999px; cursor: pointer;
        transition: opacity 120ms; flex-shrink: 0;
      }
      .send-btn:hover { opacity: 0.9; }
      .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .input-hint {
        max-width: 760px; margin: 8px auto 0;
        font-size: 11px; color: var(--fg-tertiary); text-align: center;
      }
      .input-hint a { color: var(--accent); }

      #build-info {
        font-family: 'JetBrains Mono', monospace; font-size: 11px;
        color: var(--fg-tertiary); padding: 4px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        FAQ RAG demo
        <div class="sub">Internal Avios sandbox · ask & follow up</div>
      </div>
      <div class="header-ctrl">
        <label for="opco">OpCo</label>
        <select id="opco">
          <option value="all">All</option>
          <option value="british-airways">BA</option>
          <option value="aer-lingus">Aer</option>
          <option value="iberia">Iberia</option>
        </select>
      </div>
      <div class="header-ctrl">
        <label for="locale">Lang</label>
        <select id="locale">
          <option value="en-GB">EN</option>
          <option value="es-ES">ES</option>
        </select>
      </div>
      <button id="reset-btn" class="reset-btn" disabled>New conversation</button>
    </header>

    <main>
      <div id="conversation" class="conversation">
        <div class="empty-state" id="empty-state">
          <h2>Ask a question</h2>
          <p>
            Pick an OpCo above to apply the hard filter, then ask anything about the help centre.
            You can follow up — the assistant remembers the conversation.
          </p>
        </div>
      </div>
    </main>

    <footer class="input-area">
      <form id="ask-form" class="input-row">
        <textarea id="question" placeholder="Type a question or follow-up… (Enter to send, Shift+Enter for new line)" rows="1" required autofocus></textarea>
        <button type="submit" id="send-btn" class="send-btn">Send</button>
      </form>
      <div class="input-hint">
        <span id="build-info"></span>
        · <a href="/graph">Relationship cluster view</a>
      </div>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
